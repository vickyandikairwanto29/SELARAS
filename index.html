<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F7FB">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SELARAS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>SELARAS – Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F7FB;--pri:#20334D;--acc:#286DA8;--mut:#7A8799;--line:#E3EAF3;--soft:#E8F1FA;--red:#C0443C;--grn:#2E8B63;--grnbg:#E4F4EC;--redbg:#FBEAE8;--tug:#D9822B;--tugbg:#FDF1E1;--card:#fff;--swoff:#C9D4E2;--outer:#DDE5EF;--toast:#20334D;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;background:var(--outer);color:var(--pri);display:flex;align-items:center;justify-content:center}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.phone{position:relative;width:390px;height:844px;max-width:100%;max-height:100%;background:var(--bg);border-radius:32px;overflow:hidden;box-shadow:0 20px 60px rgba(32,51,77,.25);display:flex;flex-direction:column}
@media(max-width:430px){.phone{border-radius:0;width:100%;height:100%}}
#screen{flex:1;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 24px}#screen::-webkit-scrollbar{display:none}
nav{display:none;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mut)}
nav svg,.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}nav button.on{color:var(--acc)}
.row{display:flex;align-items:center;gap:10px}.sb{justify-content:space-between}
.logo{font-size:24px;font-weight:800;letter-spacing:.5px}
.round{width:38px;height:38px;border-radius:50%;background:var(--card);display:grid;place-items:center;border:1px solid var(--line);flex:none;position:relative}
.round i{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--acc);border:2px solid var(--card)}
h1{font-size:21px;font-weight:800;margin-top:16px}h2{font-size:17px;font-weight:800}.sub{color:var(--mut);font-size:13px;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.lab{font-size:11px;color:var(--mut);font-weight:600}
.fld{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-top:10px}
.fld input,.fld select,.fld textarea{width:100%;border:0;outline:0;background:none;font-size:15px;font-weight:600;margin-top:4px;resize:none}
.fld input::placeholder,.fld textarea::placeholder{color:#AAB5C4;font-weight:500}
.fld:focus-within{border-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;background:var(--acc);color:#fff;border-radius:12px;padding:14px;font-weight:700;font-size:14px;margin-top:14px}
.btn.sm{width:auto;padding:8px 12px;font-size:12px;margin:0;border-radius:10px}.btn.red{background:var(--red)}.btn.sec{background:var(--soft);color:var(--acc)}
.ghost{display:block;margin:14px auto 0;font-size:12px;font-weight:600;color:var(--mut)}
.hd{display:grid;grid-template-columns:38px 1fr 50px;align-items:center;margin-bottom:6px}.hd b{text-align:center;font-size:16px}.hd button:last-child{font-size:12px;color:var(--mut);text-align:right}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:10px}
.wd{padding:7px 0;border-radius:12px;text-align:center;font-size:11px;color:var(--mut);position:relative}.wd b{display:block;font-size:15px;color:var(--pri);margin-top:3px}
.wd.on{background:var(--acc);color:#CFE2F3}.wd.on b{color:#fff}.wd u{display:block;width:4px;height:4px;border-radius:50%;background:var(--acc);margin:3px auto 0}.wd.on u{background:#fff}.wd:not(.has) u{visibility:hidden}
.st{display:flex;justify-content:space-between;align-items:center;margin-top:20px}.st h2{font-size:16px}.st small{font-size:12px;color:var(--mut);font-weight:500}.lnk{color:var(--acc);font-size:12px;font-weight:700}
.evt{display:flex;gap:12px;align-items:center;cursor:pointer}
.tm{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 8px;font-size:11px;font-weight:700;text-align:center;line-height:1.4;flex:none}
.tt{font-weight:700;font-size:14px;line-height:1.3}.meta{font-size:12px;color:var(--mut);margin-top:2px}
.tag{max-width:120px;overflow:hidden;text-overflow:ellipsis;font-size:10px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--soft);color:var(--acc);white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-top:14px}
.tabs button{padding:8px 0;border-radius:9px;font-size:12px;font-weight:600;color:var(--mut)}.tabs .on{background:var(--acc);color:#fff}
.dl{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:10px;padding-top:10px;font-size:12px}
.ck{width:30px;height:30px;border-radius:10px;background:var(--soft);color:var(--acc);display:grid;place-items:center;flex:none}.ck.on{background:var(--acc);color:#fff}
.done .tt{text-decoration:line-through;color:var(--mut)}
.ck.ok{background:var(--grnbg);color:var(--grn)}.ck.del{background:var(--redbg);color:var(--red)}
.tcard{border-left:4px solid var(--tug)}.tcard.done{border-left-color:var(--grn)}.scard{border-left:4px solid var(--acc)}
.tag.tg{background:var(--tugbg);color:var(--tug)}.tag.kg{background:var(--soft);color:var(--acc)}.tag.ok{background:var(--grnbg);color:var(--grn)}
.ghost.red{color:var(--red)}.btn.redsoft{background:var(--redbg);color:var(--red)}
.seg button[data-v="Tandai Selesai"].on{background:var(--grn)}
.calbtn{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--pri)}.calbtn svg{color:var(--acc)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px;text-align:center}.cw{font-size:11px;font-weight:700;color:var(--mut);padding:4px 0}
.cd{height:40px;border-radius:12px;font-size:14px;font-weight:600;position:relative;color:var(--pri)}.cd.td{border:1.5px solid var(--acc);color:var(--acc)}.cd.on{background:var(--acc);color:#fff}
.cd u{position:absolute;bottom:5px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%;background:var(--acc)}.cd.on u{background:#fff}
.csel{border:1px solid var(--line);border-radius:10px;padding:8px 6px;font-size:13px;font-weight:700;background:var(--bg);color:var(--pri)}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;background:var(--tug)}.dot.kg{background:var(--acc)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.seg button{padding:9px;border-radius:9px;background:var(--bg);font-size:12px;font-weight:600;color:var(--mut)}.seg .on{background:var(--acc);color:#fff}
.empty{text-align:center;padding:26px 10px 14px}.empty b{font-size:14px;display:block}.empty p{font-size:12px;color:var(--mut);margin:6px 0 12px;line-height:1.5}
.av{width:54px;height:54px;border-radius:50%;background:var(--soft);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:18px;border:1px solid var(--line);flex:none}
.set{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.set:last-child{border:0}
.sw{width:42px;height:25px;border-radius:99px;background:var(--swoff);position:relative;flex:none;margin-left:auto}.sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--acc)}.sw.on::after{left:20px}
.err{color:var(--red);font-size:12px;margin-top:10px;min-height:16px;text-align:center}
.ob h1{font-size:30px;line-height:1.2;margin-top:34px}.ob .card{display:flex;gap:12px;align-items:center;margin-top:12px;padding:16px}
.ico{width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--acc);display:grid;place-items:center;flex:none}
#ov{position:absolute;inset:0;background:rgba(32,51,77,.45);display:none;align-items:flex-end;z-index:5}#ov.show{display:flex}
.sheet{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.chips button{padding:9px 16px;border-radius:99px;background:var(--soft);color:var(--acc);font-weight:700;font-size:13px}.chips .on{background:var(--acc);color:#fff}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--toast);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90%;text-align:center}#toast.show{opacity:1}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
:root[data-theme="dark"]{--bg:#0E1626;--card:#16233A;--pri:#E6EDF7;--acc:#3B88CB;--mut:#93A3BA;--line:#25364F;--soft:#1C2E4A;--red:#E5675F;--grn:#4CC38A;--grnbg:#173A2C;--redbg:#3A1F25;--tug:#F0A04B;--tugbg:#3A2B17;--swoff:#3A4B66;--outer:#070C16;--toast:#2B3F5E;color-scheme:dark}
.pg{height:5px;border-radius:99px;background:var(--line);margin-top:10px;overflow:hidden}.pg i{display:block;height:100%;background:var(--tug);transition:width .2s}.tcard.done .pg i{background:var(--grn)}
.sl{display:grid;gap:2px;margin-top:6px}.si{display:flex;align-items:center;gap:10px;font-size:13px;text-align:left;padding:5px 0;width:100%;color:var(--pri)}
.cb{width:20px;height:20px;border-radius:7px;border:2px solid #9FB0C6;display:grid;place-items:center;color:#fff;flex:none}.si.done .cb{background:var(--grn);border-color:var(--grn)}.si.done .st2{text-decoration:line-through;color:var(--mut)}
.subf{display:grid;gap:4px;margin-top:6px}.subr{display:flex;align-items:center;gap:8px}.subr .si{width:auto;padding:0}.subr .sbt{flex:1;font-size:14px;font-weight:600}.subr .ck{width:26px;height:26px}
.fld .addrow{display:flex;gap:8px;margin-top:8px;align-items:center}.fld .addrow input{margin:0;flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);font-size:14px}
</style>
</head>
<body>
<div class="phone"><div id="screen"></div><nav id="nav"></nav><div id="ov"></div><div id="toast"></div></div>
<script>
const TODAY=(d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"))(new Date()),$=i=>document.getElementById(i);
const DS=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"],MS=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const fresh=()=>({ob:false,tab:"home",sel:TODAY,tf:"Mendatang",view:null,nid:1,
 prof:{nama:"",nim:"",prodi:"",sem:"",fak:""},set:{rem:true,remH:3,rest:true,gap:30,alarm:true,lead:60,talarm:true,tlead:1440,theme:"auto"},tasks:[],sched:[],fired:[]});
let S=fresh();try{const x=localStorage.getItem("selaras");if(x)S=JSON.parse(x)}catch(e){}
S.sel=TODAY;S.fired=S.fired||[];S.set=Object.assign({alarm:true,lead:60,talarm:true,tlead:1440,theme:"auto"},S.set);if(![30,60,120,180].includes(S.set.lead))S.set.lead=60;if(![360,720,1440,2880].includes(S.set.tlead))S.set.tlead=1440;
const save=()=>{try{localStorage.setItem("selaras",JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const D=i=>new Date(i+"T12:00:00Z"),iso=d=>d.toISOString().slice(0,10),add=(i,n)=>{const d=D(i);d.setUTCDate(d.getUTCDate()+n);return iso(d)};
const fmt=(i,s)=>{const d=D(i);return DS[d.getUTCDay()]+", "+d.getUTCDate()+" "+(s?MS[d.getUTCMonth()].slice(0,3):MS[d.getUTCMonth()])+" "+d.getUTCFullYear()};
const mon=i=>add(i,-((D(i).getUTCDay()+6)%7)),mins=t=>+t.slice(0,2)*60+ +t.slice(3);
const ini=()=>S.prof.nama.trim()?S.prof.nama.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase():"M";
const I={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',jadwal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>',tugas:'<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/>',profil:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',back:'<path d="M15 5l-7 7 7 7"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',chk:'<path d="M5 12l5 5 9-10"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>'};
const ic=k=>`<svg class="ic" viewBox="0 0 24 24" style="width:18px;height:18px">${I[k]}</svg>`;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200)}
function sheet(h){$("ov").innerHTML='<div class="sheet">'+h+'</div>';$("ov").classList.add("show")}
function closeSheet(){$("ov").classList.remove("show");$("ov").innerHTML=""}
$("ov").addEventListener("click",e=>{if(e.target.id==="ov")closeSheet()});
function go(t){S.tab=t;S.view=null;render();$("screen").scrollTop=0}
function openV(t,id){S.view={t,id:id||0};render();$("screen").scrollTop=0}
function back(){S.view=null;render()}
const bell=()=>`<button class="round" onclick="openV('notif')" aria-label="Notifikasi">${ic("bell")}${notifs().length?"<i></i>":""}</button>`;
const hdr=()=>`<div class="row sb"><div class="logo">SELARAS</div>${bell()}</div>`;
function notifs(){if(!S.set.rem)return[];return S.tasks.filter(t=>!t.done&&t.d>=TODAY&&t.d<=add(TODAY,S.set.remH)).sort((a,b)=>a.d.localeCompare(b.d))}
const upc=()=>S.tasks.filter(t=>!t.done).sort((a,b)=>(a.d+a.w).localeCompare(b.d+b.w));
const occ=(s,d)=>s.d===d||(s.rep==="weekly"&&d>s.d&&(!s.until||d<=s.until)&&Math.round((D(d)-D(s.d))/864e5)%7===0);
const dayEv=d=>S.sched.filter(s=>occ(s,d)).sort((a,b)=>mins(a.a)-mins(b.a));

function week(){const m=mon(S.sel),mo=D(S.sel);let h=`<div class="row sb" style="margin-top:16px"><button class="calbtn" onclick="calOpen()" aria-label="Pilih tanggal">${ic("jadwal")}<span>${MS[mo.getUTCMonth()]} ${mo.getUTCFullYear()}</span><span style="color:var(--mut)">▾</span></button><span class="row"><button class="lnk" onclick="S.sel=add(S.sel,-7);render()" aria-label="Minggu sebelumnya">‹</button><button class="lnk" onclick="S.sel='${TODAY}';render()">Hari ini</button><button class="lnk" onclick="S.sel=add(S.sel,7);render()" aria-label="Minggu berikutnya">›</button></span></div><div class="card" style="margin-top:8px;padding:8px"><div class="week">`;
 for(let i=0;i<7;i++){const d=add(m,i),has=dayEv(d).length||S.tasks.some(t=>!t.done&&t.d===d);h+=`<button class="wd ${d===S.sel?"on":""} ${has?"has":""}" onclick="S.sel='${d}';render()">${["Sen","Sel","Rab","Kam","Jum","Sab","Min"][i]}<b>${+d.slice(8)}</b><u></u></button>`}
 return h+"</div></div>"}
function tcard(t){const late=t.d<TODAY&&!t.done;return `<div class="card tcard ${t.done?"done":""}" style="margin-top:10px"><div class="row sb" style="align-items:flex-start"><div style="cursor:pointer;flex:1" onclick="openV('task',${t.id})"><div class="meta" style="margin:0"><span class="tag ${t.done?"ok":"tg"}">${t.done?"✓ Selesai":"Tugas"}</span> ${esc(t.mk)} • ${t.tipe}</div><div class="tt" style="font-size:15px;margin-top:6px">${esc(t.j)}</div></div>
 <div class="row" style="gap:6px;flex:none"><button class="ck" onclick="openV('task',${t.id})" aria-label="Ubah tugas">${ic("edit")}</button><button class="ck del" onclick="del('task',${t.id})" aria-label="Hapus tugas">${ic("trash")}</button>${t.done?`<button class="ck" style="background:var(--line);color:var(--pri)" onclick="undo(${t.id})" aria-label="Batalkan selesai">${ic("x")}</button>`:`<button class="ck ok" onclick="toggle(${t.id})" aria-label="Tandai selesai">${ic("chk")}</button>`}</div></div>
 ${subsHtml(t)}<div class="dl"><span class="row" style="gap:6px">${ic("clock")}<span>Deadline: <b style="color:${late?"var(--red)":"inherit"}">${fmt(t.d,1)}</b></span></span><span class="tag">${t.w} WIB</span></div></div>`}
function scard(s){return `<div class="card evt scard" onclick="openV('sched',${s.id})"><div class="tm">${s.a}<br>${s.b}</div><div style="flex:1"><div class="meta" style="margin:0 0 4px"><span class="tag kg">Kegiatan</span> ${esc(s.kat)}${s.rep==="weekly"?' <span class="tag">Mingguan</span>':""}${S.set.alarm&&s.alarm!==false?` <span style="color:var(--acc);display:inline-flex;vertical-align:middle" title="Alarm aktif">${ic("bell")}</span>`:""}</div><div class="tt">${esc(s.j)}</div><div class="meta">${esc(s.l||"Lokasi belum diisi")}</div></div></div>`}
const emptyT=(h,p,b,f)=>`<div class="card empty"><b>${h}</b><p>${p}</p><button class="btn sm" onclick="${f}">${b}</button></div>`;

function vOb(){return `<div class="ob" style="display:flex;flex-direction:column;min-height:100%"><div class="row" style="margin-top:20px;gap:12px"><svg width="46" height="46" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#20334D"/><circle cx="50" cy="50" r="32" fill="none" stroke="#fff" stroke-width="3.2"/><g stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M50 22.5v3.5M50 74v3.5M22.5 50H26M74 50h3.5"/></g><path d="M50 30a10 10 0 0 1 0 20a10 10 0 0 0 0 20" fill="none" stroke="#6FB1E8" stroke-width="4.6" stroke-linecap="round"/><circle cx="50" cy="50" r="2.4" fill="#fff"/></svg><div class="logo" style="letter-spacing:3px;font-size:18px">SELARAS</div></div>
 <h1>Aktivitas tertata,<br>kuliah lebih selaras.</h1><div class="sub" style="line-height:1.5">Atur tugas, jadwal, dan waktu istirahat agar harimu lebih seimbang.</div>
 <div style="margin-top:22px">${[["tugas","Kelola tugas kuliah","Catat tugas dan pantau deadline."],["jadwal","Susun jadwal harian","Lihat kegiatan dan waktu kosongmu."],["clock","Jaga waktu istirahat","Beri jeda di sela aktivitas kuliah."]].map(a=>`<div class="card"><div class="ico">${ic(a[0])}</div><div><div class="tt">${a[1]}</div><div class="meta">${a[2]}</div></div></div>`).join("")}</div>
 <div style="flex:1;min-height:30px"></div><button class="btn" onclick="S.ob=true;render()">Mulai</button><div class="sub" style="text-align:center;margin:12px 0 4px;font-size:12px">Tanpa akun. Langsung gunakan.</div></div>`}

function vHome(){const ev=dayEv(S.sel),u=upc().slice(0,2),isT=S.sel===TODAY;
 return hdr()+`<h1 style="margin-top:14px">Halo, ${esc(S.prof.nama.trim().split(" ")[0]||"Mahasiswa")}!</h1><div class="sub">Selamat datang di Selaras.</div>`+week()+

function saveTask(id){const o={mk:gv("f1"),j:gv("f2"),tipe:gs("f3"),d:$("f4").value,w:$("f5").value,note:gv("f6"),alarm:$("f8").classList.contains("on")};
 if(!o.mk||!o.j||!o.d||!o.w){$("err").textContent="Mata kuliah, nama tugas, tanggal, dan waktu wajib diisi.";return}
 const pend=gv("f9");if(pend)SUBS.push({id:Date.now(),t:pend,done:false});o.subs=SUBS.map(q=>({...q}));
 if(id){const t=S.tasks.find(x=>x.id===id);Object.assign(t,o,{done:gs("f7")==="Tandai Selesai"})}else S.tasks.push({id:S.nid++,done:false,...o});
 S.view=null;toast(id?"Perubahan tugas disimpan":"Tugas berhasil disimpan");render()}
function saveSched(id,force){const o={kat:gv("f1"),j:gv("f2"),d:$("f3").value,a:$("f4").value,b:$("f5").value,l:gv("f6"),note:gv("f7"),alarm:$("f8").classList.contains("on"),rep:gs("f9")==="Setiap Minggu"?"weekly":"",until:gs("f9")==="Setiap Minggu"?$("f10").value:""};
 if(!o.kat||!o.j||!o.d||!o.a||!o.b){$("err").textContent="Kategori, nama kegiatan, tanggal, dan jam wajib diisi.";return}
 if(mins(o.b)<=mins(o.a)){$("err").textContent="Jam selesai harus setelah jam mulai.";return}
 if(o.rep&&o.until&&o.until<o.d){$("err").textContent="Tanggal berakhir harus setelah tanggal mulai.";return}
 if(!force){const c=conflict(o,id);if(c){confSheet(c,id);return}}
 let w="";if(S.set.rest&&!/istirahat/i.test(o.kat))S.sched.forEach(s=>{if(s.id!==id&&occ(s,o.d)&&!/istirahat/i.test(s.kat)){const g=mins(o.a)>=mins(s.b)?mins(o.a)-mins(s.b):mins(s.a)>=mins(o.b)?mins(s.a)-mins(o.b):-1;if(g>=0&&g<S.set.gap)w=" Jeda dengan kegiatan lain kurang dari "+S.set.gap+" menit."}});
 if(id)Object.assign(S.sched.find(x=>x.id===id),o);else S.sched.push({id:S.nid++,...o});
 S.sel=o.d;S.view=null;toast((id?"Perubahan jadwal disimpan.":"Jadwal berhasil disimpan.")+w);render()}

const leadLbl=m=>m>=60?(m/60)+" jam":m+" menit";
function ring(){try{const C=window.AudioContext||window.webkitAudioContext,a=new C();[0,.4,.8].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.2;o.connect(g);g.connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+.22)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
function fireAlarm(s,min,test){ring();const w=(test?"Contoh alarm: ":"")+(min>0?min+" menit lagi":"segera dimulai");
 sheet(`<div style="text-align:center"><div class="ico" style="margin:0 auto 10px;width:48px;height:48px;border-radius:16px">${ic("bell")}</div><h2>Pengingat Kegiatan</h2><div class="tt" style="font-size:16px;margin-top:10px">${esc(s.j)}</div><div class="meta" style="font-size:13px">Mulai pukul ${s.a} • ${w}</div><div class="meta">${esc(s.l||"Lokasi belum diisi")}</div></div><div class="two" style="margin-top:18px"><button class="btn sec" style="margin:0" onclick="closeSheet()">Tutup</button><button class="btn" style="margin:0" onclick="closeSheet();S.sel='${s.d||TODAY}';go('jadwal')">Lihat Jadwal</button></div>`);
 try{if(!test&&"Notification" in window&&Notification.permission==="granted")new Notification("SELARAS: "+s.j,{body:"Mulai pukul "+s.a+" ("+w+")"})}catch(e){}}
function testAlarm(){fireAlarm({j:"Kuliah Sistem Basis Data",a:"08:00",l:"Ruang Teori 302"},Math.round(S.set.lead),true)}
const nowISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const tLbl=m=>m>=1440?(m/1440)+" hari":m>=60?(m/60)+" jam":m+" menit";
const leftLbl=m=>m>=1440?Math.round(m/1440)+" hari lagi":m>=60?Math.round(m/60)+" jam lagi":m+" menit lagi";
function checkAlarms(){if(!S.ob||$("ov").classList.contains("show"))return;if(S.fired.length>300)S.fired=S.fired.slice(-200);const now=Date.now(),t0=nowISO();
 if(S.set.alarm)for(const dd of[t0,add(t0,1)])for(const s of S.sched){if(s.alarm===false||!occ(s,dd))continue;const st=new Date(dd+"T"+s.a+":00").getTime(),k="e|"+s.id+"|"+dd+"|"+s.a+"|"+S.set.lead;
  if(now>=st-S.set.lead*6e4&&now<st&&!S.fired.includes(k)){S.fired.push(k);save();fireAlarm({...s,d:dd},Math.ceil((st-now)/6e4));return}}
 if(S.set.talarm)for(const t of S.tasks){if(t.done||t.alarm===false)continue;const du=new Date(t.d+"T"+t.w+":00").getTime(),k="t|"+t.id+"|"+t.d+"|"+t.w+"|"+S.set.tlead;
  if(now>=du-S.set.tlead*6e4&&now<du&&!S.fired.includes(k)){S.fired.push(k);save();fireTask(t,Math.ceil((du-now)/6e4));return}}}
function fireTask(t,min,test){ring();const w=(test?"Contoh alarm: ":"")+leftLbl(min);
 sheet(`<div style="text-align:center"><div class="ico" style="margin:0 auto 10px;width:48px;height:48px;border-radius:16px;background:var(--tugbg);color:var(--tug)">${ic("tugas")}</div><h2>Pengingat Tugas</h2><div class="tt" style="font-size:16px;margin-top:10px">${esc(t.j)}</div><div class="meta" style="font-size:13px">${esc(t.mk)} • Tenggat ${fmt(t.d,1)} pukul ${t.w} WIB</div><div class="meta">${w}</div></div><div class="two" style="margin-top:18px"><button class="btn sec" style="margin:0" onclick="closeSheet()">Tutup</button><button class="btn" style="margin:0" onclick="closeSheet();S.tf='Mendatang';go('tugas')">Lihat Tugas</button></div>`);
 try{if(!test&&"Notification" in window&&Notification.permission==="granted")new Notification("SELARAS: "+t.j,{body:"Tenggat pukul "+t.w+" ("+w+")"})}catch(e){}}
function togTAlarm(){S.set.talarm=!S.set.talarm;if(S.set.talarm)askNotif();toast(S.set.talarm?"Alarm tenggat tugas diaktifkan":"Alarm tenggat tugas dimatikan");render()}
function tAlarmSet(){sheet(`<h2>Alarm tenggat tugas</h2><div class="sub">Pengingat dibunyikan sebelum tenggat tugas.</div><div class="chips">${[360,720,1440,2880].map(m=>`<button class="${S.set.tlead===m?"on":""}" onclick="S.set.tlead=${m};S.set.talarm=true;askNotif();closeSheet();toast('Alarm ${tLbl(m)} sebelum tenggat');render()">${tLbl(m)} sebelum</button>`).join("")}</div><div class="meta" style="margin-top:14px;line-height:1.5">Alarm hanya berbunyi saat SELARAS sedang terbuka di browser.</div>`)}
/* sub-tugas */
let SUBS=[];
function subsHtml(t){const a=t.subs||[];if(!a.length)return"";const n=a.filter(x=>x.done).length;
 return `<div class="pg"><i style="width:${Math.round(n/a.length*100)}%"></i></div><div class="meta" style="margin-top:6px">Sub-tugas ${n}/${a.length}</div><div class="sl">${a.map(x=>`<button class="si ${x.done?"done":""}" onclick="subTog(${t.id},${x.id})"><span class="cb">${x.done?ic("chk").replace(/18px/g,"12px"):""}</span><span class="st2">${esc(x.t)}</span></button>`).join("")}</div>`}
function subTog(tid,sid){const t=S.tasks.find(x=>x.id===tid),q=t.subs.find(x=>x.id===sid);q.done=!q.done;if(t.subs.every(x=>x.done)&&!t.done)toast("Semua sub-tugas selesai. Tandai tugasnya selesai?");render()}
function subsForm(){const el=$("subf");if(!el)return;el.innerHTML=SUBS.map((x,i)=>`<div class="subr"><button class="si ${x.done?"done":""}" onclick="SUBS[${i}].done=!SUBS[${i}].done;subsForm()" aria-label="Tandai sub-tugas"><span class="cb">${x.done?ic("chk").replace(/18px/g,"12px"):""}</span></button><span class="sbt">${esc(x.t)}</span><button class="ck del" onclick="SUBS.splice(${i},1);subsForm()" aria-label="Hapus sub-tugas">${ic("x").replace(/18px/g,"14px")}</button></div>`).join("")}
function subAdd(){const i=$("f9"),v=i.value.trim();if(!v)return;SUBS.push({id:Date.now()+SUBS.length,t:v,done:false});i.value="";subsForm();i.focus()}
/* jadwal bentrok */
function conflict(o,id){const ds=[];if(o.rep==="weekly"){for(let i=0;i<12;i++){const d=add(o.d,i*7);if(o.until&&d>o.until)break;ds.push(d)}}else ds.push(o.d);
 for(const d of ds)for(const s of S.sched){if(s.id===id)continue;if(occ(s,d)&&mins(o.a)<mins(s.b)&&mins(s.a)<mins(o.b))return{s,d}}return null}
function confSheet(c,id){sheet(`<h2>Jadwal bentrok</h2><div class="sub" style="margin:6px 0 16px;line-height:1.5">Waktunya tumpang tindih dengan <b>${esc(c.s.j)}</b> (${c.s.a}–${c.s.b}) pada ${fmt(c.d,1)}.</div><div class="two"><button class="btn sec" style="margin:0" onclick="closeSheet()">Ubah Waktu</button><button class="btn" style="margin:0" onclick="closeSheet();saveSched(${id},true)">Tetap Simpan</button></div>`)}
/* tema */
function applyTheme(){const t=S.set.theme,dk=t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=dk?"dark":"light";const m=document.querySelector('meta[name=theme-color]');if(m)m.content=dk?"#0E1626":"#F4F7FB"}
const themeLbl=()=>({auto:"Otomatis (ikuti perangkat)",light:"Terang",dark:"Gelap"}[S.set.theme]||"Otomatis (ikuti perangkat)");
function themeSet(){sheet(`<h2>Tampilan</h2><div class="sub">Pilih tema terang atau gelap.</div><div class="chips">${[["auto","Otomatis"],["light","Terang"],["dark","Gelap"]].map(a=>`<button class="${S.set.theme===a[0]?"on":""}" onclick="S.set.theme='${a[0]}';closeSheet();toast('Tampilan: ${a[1]}');render()">${a[1]}</button>`).join("")}</div><div class="meta" style="margin-top:14px">Otomatis mengikuti pengaturan tema perangkat Anda.</div>`)}
/* cadangan */
function exportData(){try{const j=JSON.stringify({app:"SELARAS",versi:1,diekspor:new Date().toISOString(),data:{prof:S.prof,set:S.set,tasks:S.tasks,sched:S.sched,nid:S.nid}},null,1),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([j],{type:"application/json"}));a.download="selaras-cadangan-"+nowISO()+".json";document.body.appendChild(a);a.click();a.remove();toast("Berkas cadangan diunduh")}catch(e){toast("Gagal menyimpan berkas")}}
let PEND=null;
function impFile(inp){const f=inp.files[0];inp.value="";if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result),d=o.data;if(o.app!=="SELARAS"||!d||!Array.isArray(d.tasks)||!Array.isArray(d.sched))throw 0;PEND=d;sheet(`<h2>Pulihkan data?</h2><div class="sub" style="margin:6px 0 16px;line-height:1.5">Berkas berisi ${d.tasks.length} tugas dan ${d.sched.length} jadwal. Data di aplikasi sekarang akan diganti.</div><div class="two"><button class="btn sec" style="margin:0" onclick="closeSheet()">Batal</button><button class="btn" style="margin:0" onclick="doImport()">Pulihkan</button></div>`)}catch(e){toast("Berkas tidak valid")}};r.readAsText(f)}
function doImport(){const d=PEND,mx=Math.max(0,...d.tasks.map(x=>x.id||0),...d.sched.map(x=>x.id||0))+1,b=fresh();S=Object.assign(b,{ob:true,tab:"profil",prof:Object.assign(b.prof,d.prof),tasks:d.tasks,sched:d.sched,nid:Math.max(d.nid||1,mx)});S.set=Object.assign(b.set,d.set);S.sel=TODAY;closeSheet();toast("Data berhasil dipulihkan");render()}
function togAlarm(){S.set.alarm=!S.set.alarm;if(S.set.alarm)askNotif();toast(S.set.alarm?"Alarm kegiatan diaktifkan":"Alarm kegiatan dimatikan");render()}
function askNotif(){try{if("Notification" in window&&Notification.permission==="default")Notification.requestPermission()}catch(e){}}
function alarmSet(){let n="Notifikasi browser tidak didukung di perangkat ini.";try{if("Notification" in window)n={granted:"Notifikasi browser sudah diizinkan.",denied:"Notifikasi browser diblokir di pengaturan browser.",default:"Ketuk Izinkan agar notifikasi muncul di layar."}[Notification.permission]}catch(e){}
 sheet(`<h2>Alarm jadwal kegiatan</h2><div class="sub">Pengingat dibunyikan sebelum kegiatan dimulai.</div><div class="chips">${[30,60,120,180].map(m=>`<button class="${S.set.lead===m?"on":""}" onclick="S.set.lead=${m};S.set.alarm=true;askNotif();closeSheet();toast('Alarm ${leadLbl(m)} sebelum kegiatan');render()">${leadLbl(m)} sebelum</button>`).join("")}</div><div class="meta" style="margin-top:14px;line-height:1.5">${n}<br>Alarm hanya berbunyi saat SELARAS sedang terbuka di browser.</div>`)}
let CAL={y:2026,m:10};
function calOpen(){CAL={y:+S.sel.slice(0,4),m:+S.sel.slice(5,7)-1};calDraw()}
function calGo(n){CAL.m+=n;if(CAL.m<0){CAL.m=11;CAL.y--}if(CAL.m>11){CAL.m=0;CAL.y++}calDraw()}
function calDraw(){const was=$("ov").classList.contains("show"),first=(new Date(Date.UTC(CAL.y,CAL.m,1,12)).getUTCDay()+6)%7,n=new Date(Date.UTC(CAL.y,CAL.m+1,0,12)).getUTCDate();
 let g=["Sen","Sel","Rab","Kam","Jum","Sab","Min"].map(x=>`<div class="cw">${x}</div>`).join("")+"<span></span>".repeat(first);
 for(let i=1;i<=n;i++){const d=iso(new Date(Date.UTC(CAL.y,CAL.m,i,12))),has=dayEv(d).length||S.tasks.some(t=>!t.done&&t.d===d);
  g+=`<button class="cd ${d===S.sel?"on":""} ${d===TODAY?"td":""}" onclick="S.sel='${d}';closeSheet();render()">${i}${has?"<u></u>":""}</button>`}
 const ys=[];for(let y=CAL.y-5;y<=CAL.y+5;y++)ys.push(y);
 sheet(`<div class="row sb"><button class="ck" onclick="calGo(-1)" aria-label="Bulan sebelumnya">${ic("back")}</button><div class="row" style="gap:6px"><select class="csel" aria-label="Bulan" onchange="CAL.m=+this.value;calDraw()">${MS.map((m,i)=>`<option value="${i}" ${i===CAL.m?"selected":""}>${m}</option>`).join("")}</select><select class="csel" aria-label="Tahun" onchange="CAL.y=+this.value;calDraw()">${ys.map(y=>`<option ${y===CAL.y?"selected":""}>${y}</option>`).join("")}</select></div><button class="ck" style="transform:scaleX(-1)" onclick="calGo(1)" aria-label="Bulan berikutnya">${ic("back")}</button></div><div class="cal">${g}</div><div class="two" style="margin-top:12px"><button class="btn sec" style="margin:0" onclick="closeSheet()">Tutup</button><button class="btn" style="margin:0" onclick="S.sel='${TODAY}';closeSheet();render()">Hari ini</button></div>`);
 if(was)document.querySelector("#ov .sheet").style.animation="none"}
function render(){applyTheme();const on=S.ob;$("nav").style.display=on?"flex":"none";
 $("nav").innerHTML=[["home","Home"],["jadwal","Jadwal"],["tugas","Tugas"],["profil","Profil"]].map(([k,l])=>`<button class="${S.tab===k?"on":""}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${I[k]}</svg>${l}</button>`).join("");
 $("screen").innerHTML=!on?vOb():S.view?vForm():({home:vHome,jadwal:vJadwal,tugas:vTugas,profil:vProfil})[S.tab]();if(S.ob&&S.view&&S.view.t==="task")subsForm();save()}
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme)}catch(e){}
render();setInterval(checkAlarms,15000);document.addEventListener("visibilitychange",checkAlarms);setTimeout(checkAlarms,800);
</script>
